[project]
name = "cmapkit"
dynamic = ["version"]
description = "Colour maps designed in CAM16-UCS: categorical palettes whose closest pair is as distinct as possible, and long maps for images of high dynamic range, both for colour-blind readers too"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: Matplotlib",
]

[project.urls]
Repository = "https://github.com/DavidLister/cmapkit"

[project.optional-dependencies]
matplotlib = ["matplotlib>=3.7"]
test = ["pytest", "colour-science", "matplotlib>=3.7"]
bench = ["matplotlib", "colour-science", "colorspacious", "glasbey", "qualpal"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cmapkit", "cmapkit.mccp", "cmapkit.hdrmaps"]

[tool.setuptools.dynamic]
version = {attr = "cmapkit.__version__"}

[tool.setuptools.package-data]
"cmapkit.mccp" = ["data/*.json"]
"cmapkit.hdrmaps" = ["data/*.json"]

[tool.pytest.ini_options]
markers = ["slow: takes more than a few seconds (ring layout search)"]
